version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    pre_build:
      # Notebooks live outside docs/, so copy them in before Sphinx runs
      - mkdir -p docs/source/tutorials
      - cp -r tutorials/*.ipynb docs/source/tutorials/ || true

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt

formats: []
